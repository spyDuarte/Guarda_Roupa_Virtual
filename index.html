<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritinha's Virtual Wardrobe</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <div class="header-container">
            <h1>Ritinha's Virtual Wardrobe</h1>
        </div>
    </header>

    <!-- Hero Section -->
    <section id="hero">
        <div class="hero-content">
            <h1>Your Personal Style, Organized.</h1>
            <p>Manage your wardrobe, plan outfits, and rediscover your favorite clothes effortlessly.</p>
            <a href="#add-item-section" class="cta-button">Add New Item</a>
        </div>
    </section>

    <main>
        <!-- Add Item Section -->
        <section id="add-item-section">
            <h2>Add Item</h2>
            <form id="add-item-form">
                <input type="text" id="item-name" placeholder="Item Name" required>
                <div class="image-input-group">
                    <input type="text" id="item-image" placeholder="Image URL">
                    <span>OR</span>
                    <input type="file" id="item-file" accept="image/*">
                </div>
                <select id="item-category" required>
                    <option value="" disabled selected>Select Category</option>
                    <option value="tops">Tops</option>
                    <option value="bottoms">Bottoms</option>
                    <option value="shoes">Shoes</option>
                    <option value="accessories">Accessories</option>
                </select>
                <input type="text" id="item-brand" placeholder="Brand">
                <input type="text" id="item-size" placeholder="Size">
                <input type="text" id="item-color" placeholder="Color">
                <textarea id="item-notes" placeholder="Notes (optional)" rows="2"></textarea>
                <button type="submit">Add to Wardrobe</button>
            </form>
        </section>

        <!-- Filter Section -->
        <section id="filter-section">
            <div id="search-bar-container">
                <input type="text" id="search-input" placeholder="Search items...">
            </div>
            <div class="filter-buttons-group">
                <button class="filter-btn" data-category="all">All</button>
                <button class="filter-btn" data-category="tops">Tops</button>
                <button class="filter-btn" data-category="bottoms">Bottoms</button>
                <button class="filter-btn" data-category="shoes">Shoes</button>
                <button class="filter-btn" data-category="accessories">Accessories</button>
            </div>
        </section>

        <!-- Gallery Section -->
        <section id="gallery-section">
            <div id="gallery-grid" class="gallery-grid">
                <!-- Items will be injected here by script.js -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Ritinha's Wardrobe. All rights reserved.</p>
    </footer>

    <!-- Modal Structure -->
    <div id="item-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="modal-details">
                <!-- Details injected here -->
            </div>
        </div>
    </div>
</body>
</html>
